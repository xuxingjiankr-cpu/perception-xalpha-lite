# Independently re-check the benchmark the dashboard is drawn against.
#
# This job writes nothing. It runs separately from the one that produces the record, fetches
# the index series again, and fails if any already-committed benchmark return no longer
# matches its source. A benchmark nobody re-verifies is one that can drift to flatter the
# strategy sitting next to it, and a verifier that can also rewrite the file is not a verifier.
name: verify-benchmark

on:
  schedule:
    - cron: "30 10 * * 1-5"   # 18:30 Asia/Shanghai, after the record has been written
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q baostock

      - name: Re-fetch the index and compare
        run: |
          python - <<'PY'
          import json, pathlib, sys
          rows = [json.loads(line) for line in
                  pathlib.Path("docs/data/rotation.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          if not rows:
              sys.exit("series is empty")
          import baostock as bs
          bs.login()
          try:
              closes = {}
              for code in ("sh.000016", "sh.000300"):
                  result = bs.query_history_k_data_plus(
                      code, "date,open", start_date=rows[0]["date"], end_date=rows[-1]["date"], frequency="d")
                  series = {}
                  while result.error_code == "0" and result.next():
                      date, value = result.get_row_data()
                      series[date] = float(value)
                  closes[code] = series
                  print(f"{code}: {len(series)} sessions fetched")
          finally:
              bs.logout()

          worst, checked = 0.0, 0
          for code, series in closes.items():
              key, dates = code.replace(".", "_"), sorted(series)
              position = {date: index for index, date in enumerate(dates)}
              for row in rows:
                  committed, index = row.get(key), position.get(row["date"])
                  if committed is None or not index:
                      continue
                  actual = series[dates[index]] / series[dates[index - 1]] - 1.0
                  worst = max(worst, abs(actual - float(committed)))
                  checked += 1
          print(f"checked {checked} committed index returns, worst disagreement {worst:.2e}")
          if not checked:
              sys.exit("nothing was checked; the comparison is vacuous")
          if worst > 5e-4:
              sys.exit(f"benchmark disagrees with its source by {worst:.4f}")
          PY
