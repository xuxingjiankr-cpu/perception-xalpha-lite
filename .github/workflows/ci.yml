name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .
          python -m pip install pytest

      - name: Test
        run: python -m pytest tests -q

      # The examples are part of the contract, not decoration: a framework about
      # reproducibility has to prove its own examples still run on every commit.
      - name: Examples reproduce
        run: |
          python examples/selection_artifact.py
          python examples/run_synthetic.py

      - name: No order path exists
        run: |
          python - <<'PY'
          import pathlib, re, sys
          # The repository's central promise is that research cannot place a trade.
          # Assert it mechanically so the promise cannot rot silently.
          banned = re.compile(r"\b(place_order|submit_order|create_order|send_order)\b")
          offenders = [
              str(path)
              for path in pathlib.Path("src").rglob("*.py")
              if banned.search(path.read_text(encoding="utf-8"))
          ]
          if offenders:
              sys.exit(f"order-placement symbols found in research code: {offenders}")
          print("ok: no order-placement path in src/")
          PY
