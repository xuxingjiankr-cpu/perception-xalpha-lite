# The daily record, computed here rather than pushed here.
#
# Selecting the name, scoring the sessions that have matured and redrawing all happen on the
# runner from the frozen specification and a public source, so the record does not depend on
# any one machine being awake and a reader can rerun it and get the same name.
name: daily-record

on:
  schedule:
    # Weekly, not daily. The provider throttles GitHub's address ranges — a workstation gets
    # 10 of 10 sample symbols in 1.2 seconds while a runner gets 12% of the universe, every
    # trading day for a week — so the picks are produced on the maintainer's machine and this
    # is now a reachability probe. If a runner can ever fetch the universe again, that is worth
    # knowing; asking daily only produces one identical issue per day.
    - cron: "0 13 * * 1"      # 21:00 Asia/Shanghai, Mondays
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute and print without writing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -e . baostock

      - name: Select, score and record
        run: |
          python tools/daily_record.py --workers 6 \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Redraw
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: python examples/render_rotation_dashboard.py

      - name: Commit
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/ README.md; then
            echo "nothing changed"
          else
            git add docs/ README.md
            git commit -m "data: daily record [skip ci]"
            git pull --rebase --autostash
            git push
          fi
